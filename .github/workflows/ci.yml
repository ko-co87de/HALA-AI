name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy hala/ --ignore-missing-imports || true

      - name: Run unit tests
        run: pytest tests/test_unit.py -v --tb=short

      - name: Run security tests
        run: pytest tests/test_security.py -v --tb=short

      - name: Run integration tests
        run: pytest tests/test_integration.py -v --tb=short

      - name: Dependency audit
        run: pip-audit || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3
        with:
          path: .
          regex: '(?i)(api[_-]?key|secret|password|token)\s*[:=]\s*["\']?[a-zA-Z0-9_\-]{16,}'